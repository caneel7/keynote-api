version: "2"
sql:
  - engine: "postgresql"
    schema: "migrate/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "citext"
            go_type: "string"
          - db_type: "citext"
            go_type: "database/sql.NullString"
            nullable: true
          - db_type: "ltree"
            go_type: "string"
          - db_type: "ltree"
            go_type: "database/sql.NullString"
            nullable: true
